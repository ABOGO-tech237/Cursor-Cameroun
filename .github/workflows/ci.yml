name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: Lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # src/db/index.ts refuse de démarrer sans URL. Cette valeur ne pointe
          # vers aucune base réelle et n'est pas un secret.
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/cursor_cameroun
